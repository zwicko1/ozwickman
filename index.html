<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffe3ee">
<title>Field of Tulips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #ffe3ee;
    --sky-bottom: #fff6f0;
    --hill-far: #bfe8c9;
    --hill-mid: #96d9a8;
    --hill-near: #6cc788;
    --pink-deep: #ff4d80;
    --pink-ink: #7a1f45;
    --card-bg: #fff8fb;
    --card-border: #ffb3cd;
    --text: #5a2a40;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { height: 100%; height: 100dvh; margin: 0; }

  body {
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
    background: var(--sky-bottom);
  }

  .field {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 48%);
  }

  /* soft sun */
  .field::before {
    content: "";
    position: absolute;
    top: 7%;
    right: 12%;
    width: clamp(70px, 10vw, 130px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #ffe9f1 55%, rgba(255, 233, 241, 0) 72%);
  }

  /* rolling hills */
  .hill {
    position: absolute;
    left: -10%;
    width: 120%;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }
  .hill.far  { bottom: 28%; height: 34%; background: var(--hill-far); }
  .hill.mid  { bottom: 0;   height: 46%; background: var(--hill-mid); left: -25%; width: 150%; }
  .hill.near { bottom: 0;   height: 26%; background: var(--hill-near); left: -5%; width: 110%; }

  .hint {
    position: absolute;
    top: 4%;
    left: 0;
    right: 0;
    text-align: center;
    font-family: "Fraunces", Georgia, serif;
    font-size: clamp(1.1rem, 2.4vw, 1.6rem);
    color: var(--pink-ink);
    letter-spacing: 0.01em;
    pointer-events: none;
    margin: 0;
    padding: 0 1rem;
  }

  /* tulips */
  .tulip {
    position: absolute;
    width: calc(var(--size) * var(--scale));
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    transform-origin: 50% 100%;
    animation: sway 5s ease-in-out infinite;
    animation-delay: var(--delay);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: filter 0.2s;
  }
  .tulip img {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
    user-select: none;
    transition: transform 0.2s ease;
    transform-origin: 50% 100%;
  }
  .tulip:focus-visible img { transform: scale(1.12); }
  @media (hover: hover) { .tulip:hover img { transform: scale(1.12); } }
  .tulip:focus-visible { outline: 3px solid var(--pink-deep); outline-offset: 2px; border-radius: 12px; }
  .tulip.star { filter: drop-shadow(0 0 14px rgba(255, 105, 150, 0.6)); }
  .tulip.active { animation-play-state: paused; filter: drop-shadow(0 0 10px rgba(255, 77, 128, 0.55)); }
  .tulip.active img { transform: scale(1.14); }

  @keyframes sway {
    0%, 100% { transform: rotate(-1.8deg); }
    50%      { transform: rotate(1.8deg); }
  }

  /* text box */
  .card {
    position: fixed;
    z-index: 300;
    width: min(250px, calc(100vw - 24px));
    padding: 14px 16px 16px;
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-radius: 16px;
    box-shadow: 0 10px 28px rgba(122, 31, 69, 0.18);
    opacity: 0;
    transform: translateY(6px) scale(0.96);
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .card.open {
    opacity: 1;
    transform: none;
    pointer-events: auto;
  }
  .card h2 {
    margin: 0 22px 8px 0;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 1.15rem;
    line-height: 1.2;
    color: var(--pink-deep);
  }
  .card p {
    margin: 0;
    font-size: 0.92rem;
    line-height: 1.5;
  }
  .card p.long { white-space: pre-wrap; }
  /* bigger box for the hilltop tulip */
  .card.big {
    width: min(400px, calc(100vw - 24px));
    min-height: 300px;
  }
  #card-body { max-height: 60vh; max-height: 60dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .close {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 26px;
    height: 26px;
    border: 0;
    border-radius: 50%;
    background: #ffe0ec;
    color: var(--pink-ink);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  .close:hover { background: #ffc9dd; }
  .close:focus-visible { outline: 2px solid var(--pink-deep); }

  /* phones / touch screens */
  @media (pointer: coarse) {
    .close { width: 36px; height: 36px; top: 6px; right: 6px; font-size: 20px; }
    .card h2 { margin-right: 34px; }
  }
  @media (hover: none) {
    .field { cursor: pointer; } /* lets iOS Safari register taps on empty space (closes the box) */
  }

  @media (prefers-reduced-motion: reduce) {
    .tulip { animation: none; }
    .card, .tulip img { transition: none; }
  }
</style>
</head>
<body>

<main class="field" id="field">
  <div class="hill far"></div>
  <div class="hill mid"></div>
  <div class="hill near"></div>
  <p class="hint">Pick a tulip</p>
</main>

<aside class="card" id="card" role="dialog" aria-live="polite" aria-labelledby="card-title">
  <button class="close" id="close" aria-label="Close">&times;</button>
  <h2 id="card-title"></h2>
  <div id="card-body"></div>
</aside>

<script>

const MESSAGES = [
  { title: "Tula #1: All In",  lines: ["Tatahakin madilim na landas,", "Nang walang lampara't gabay", "Haharapin ang 'di tiyak na bukas,", "Mahawakan lamang ang iyong kamay"] },
  { title: "Tula #2: Panata",  lines: ["Makailang ikot man mga kamay ng relo,", "At makailang punit man ng kalendaryo", "Mananatili akong sa'yo,", "'Yan ang panghabang buhay na panata ko"] },
  { title: "Tula #3: Panalangin",  lines: ["Biyaya ang makapiling ka,", "Ligaya ang mayakap ka", "Ang panalanging nag-iisa,", "Nawa'y 'di na mawalay pa"] },
  { title: "Tula #4: Sa'yo",  lines: ["Hindi ko man maibigay lahat ng yaman sa mundo,", "'Di magdadalawang isip ibigay lahat ng meron ako", "Ang akin ay ituring mong iyo,", "Sapagkat ako'y tanging laan para sa'yo"] },
  { title: "Tula #5: Prusisyon",  lines: ["Sa napakahabang prusisyon,", "Ikaw ang siyang nais makasama", "Altar ang natatanging destinasyon,", "Para sa'ting dalawa"] },
  { title: "Tula #6: Payapa",  lines: ["Ikaw ang katahimikan,", "Sa ingay ng mundo", "Magulo kong isipan,", "Payapa sa tabi mo"] },
  { title: "Tula #7: Bukas",  lines: ["Kahapon ay inibig ka,", "Ngayon ay mas umibig pa", "Sa bawat bukas na parating pa,", "Mas lalong iibigin ka"] },
  { title: "Tula #8: Sandalan",  lines: ["Umaraw man o umulan,", "Humagupit man ang bagyo", "Ang ang iyong sandalang,", "Laging nasa tabi mo"] },
  { title: "Tula #9: Habang Buhay",  lines: ["Sa bukang-liwayway,", "Maging sa tanghalia't dapit-hapon", "Sa ano mang oras at panahon,", "Ikaw lang habang buhay"] },
  { title: "Tula #10: Ikaw", lines: ["Ikaw ang nagbibigay kulay,", "Ikaw ang nagbibigay musika", "Sa aking buhay,", "Ikaw ang nagbibigay sigla"] },
  { title: "Tula #11: Nangungulila", lines: ["Laging hanap-hanap presensya mo,", "Nangungulila sa pag-alis mo", "Inaantay ang eksaktong segundo,", "Na muli kang nasa tabi ko"] },
  { title: "Tula #12: Walang Iba", lines: ["Malungkot o masaya,", "Nagtatalo o nagtatawanan", "Sa puso ay walang iba,", "Kahit saan o kailan man"] },
  { title: "Tula #13: Matalinghaga", lines: ["Mula Quezon City hanggang Lemery,", "Pag-ibig ko'y dumayo pa", "Kung pano'y tanong din sa sarili,", "Pag-ibig tunay ngang matalinghaga"] },
  { title: "Tula #14: Suwail", lines: ["Kung tadhana'y hindi tinakda ang tayo", "Sa kanya'y magiging suwail", "Pagkat ang pagmamahal ko,", "Kailanma'y hindi papipigil"] },
  { title: "Tula #15: Hanap-hanap", lines: ["Sa pagsibol ng umaga,", "Ikaw ang tanging hanap-hanap", "Sa pagpikit ng aking mata,", "Ikaw ang tanging nais kayakap"] },
  { title: "Tula #16: Pananabik", lines: ["Araw-araw ang pananabik,", "Sa yakap at tamis ng halis", "Nag-aantay, nag-aabang,", "Na ikaw ay muling mahagkan"] },
  { title: "Tula #17: Muli", lines: ["Napako man ang sumpaan,", "Na unang ginawa ng ating mga puso", "Paulit-ulit ilalaban,", "Hanggang muli tayong manalo"] },
  { title: "Tula #18: Handa", lines: ["Ako ay taong nagkamali,", "At muli pang magkakamali", "Ngunit laging handa magbago,", "Basta't para sa'yo"] },
  { title: "Tula #19: Ano?", lines: ["Ano nga ba ang magagawa,", "Ng isang taong katulad ko", "Kung hindi ang maakit sa ganda,", "At patuloy na umibig sa'yo"] },
  { title: "Tula #20: Kailangan", lines: ["Parusa kong maituturing,", "Ang isang araw na wala ka", "Ang ibig na sabihin,", "Ay kailangan ka sa tuwina"] },
  { title: "Tula #21: Sulyap", lines: ["Kung mabulag ang mata,", "Makikiusap kay bathala", "Na muling masulyapan,", "Taglay mong kagandahan"] },
  { title: "Tula #22: Higit", lines: ["Maubos man ang tinta, papel, at pluma,", "Sa kasusulat ko ng mga tula", "Hindi pa rin sapat upang ilarawan,", "Ang nararamdamang higit pa sa pagmamahal"] },

  { title: "Happy birthday my love!", text: "Happy birthday bebu! Wow, you're 22 na ha, pero baby pa rin kita don't worry! I'm so thankful for your existence, and for being in my life. Binago mo ako at ang buhay ko. You've filled my life with colors and music, and it will never be the same without you. \n\nI'm sorry if hindi ako nakapunta, and kung wala akong gift para sa'yo. Wala kasi talaga ngayon eh, and I know you understand that pero sorry pa rin mahal. I'll make it up to you kapag meron na, promise!!! In the meantime, eto muna isang flower field para sa'yo! \n\nMahal na mahal na mahal kita! Palagi, araw-araw, oras-oras, minu-minuto! Ikaw lang palagi. \n\nP.S. miss na kita, balik ka na? (sa qc kase)👉👈🌷" },
];

/* ============================================================
   TULIP LAYOUT  (x = % from left, y = % from bottom)
   Three rows: back (small), middle, front (big).
   ============================================================ */
const BACK  = { scale: 0.62, size: "clamp(40px, 8vw, 104px)" };
const MID   = { scale: 0.82, size: "clamp(40px, 8vw, 104px)" };
const FRONT = { scale: 1.05, size: "clamp(40px, 8vw, 104px)" };
const STAR  = { scale: 1.1,  size: "clamp(40px, 8vw, 104px)", star: true };

const LAYOUT = [
  // back row (7)
  { x: 7,  y: 47, ...BACK }, { x: 21, y: 50, ...BACK }, { x: 33, y: 46, ...BACK },
  { x: 40, y: 51, ...BACK }, { x: 60, y: 47, ...BACK }, { x: 76, y: 50, ...BACK },
  { x: 92, y: 46, ...BACK },
  // middle row (7)
  { x: 3,  y: 28, ...MID },  { x: 17, y: 31, ...MID },  { x: 32, y: 27, ...MID },
  { x: 47, y: 32, ...MID },  { x: 61, y: 28, ...MID },  { x: 75, y: 31, ...MID },
  { x: 90, y: 27, ...MID },
  // front row (8)
  { x: 8,  y: 6,  ...FRONT }, { x: 20, y: 9,  ...FRONT }, { x: 32, y: 5,  ...FRONT },
  { x: 44, y: 9,  ...FRONT }, { x: 56, y: 5,  ...FRONT }, { x: 68, y: 9,  ...FRONT },
  { x: 80, y: 5,  ...FRONT }, { x: 92, y: 8,  ...FRONT },
  // the special one, planted on the top of the far hill (#23)
  { x: 50, y: 58, ...STAR },
];

/* ------------------------------------------------------------
   PHONE LAYOUT (screens up to 600px wide, e.g. iPhone 15 portrait)
   Bigger tulips, 6 staggered rows instead of 3, same order of
   poems as the desktop layout (tulip #1 = first entry, etc).
   ------------------------------------------------------------ */
const M = (scale) => ({ scale, size: "16vw" });
const LAYOUT_MOBILE = [
  // row 1 (back, 4)
  { x: 10, y: 49, ...M(0.75) }, { x: 28, y: 52, ...M(0.75) }, { x: 72, y: 52, ...M(0.75) }, { x: 90, y: 49, ...M(0.75) },
  // row 2 (4)
  { x: 19, y: 40, ...M(0.82) }, { x: 41, y: 42, ...M(0.82) }, { x: 63, y: 40, ...M(0.82) }, { x: 85, y: 42, ...M(0.82) },
  // row 3 (4)
  { x: 8,  y: 31, ...M(0.9) },  { x: 31, y: 33, ...M(0.9) },  { x: 54, y: 31, ...M(0.9) },  { x: 77, y: 33, ...M(0.9) },
  // row 4 (4)
  { x: 18, y: 22, ...M(0.98) }, { x: 42, y: 24, ...M(0.98) }, { x: 66, y: 22, ...M(0.98) }, { x: 90, y: 24, ...M(0.98) },
  // row 5 (3)
  { x: 12, y: 13, ...M(1.06) }, { x: 46, y: 15, ...M(1.06) }, { x: 80, y: 13, ...M(1.06) },
  // row 6 (front, 3)
  { x: 29, y: 4,  ...M(1.14) }, { x: 63, y: 6,  ...M(1.14) }, { x: 91, y: 4,  ...M(1.14) },
  // the hilltop tulip (#23)
  { x: 50, y: 58, scale: 1.5, size: "16vw", star: true },
];

const field = document.getElementById("field");
const card = document.getElementById("card");
const cardTitle = document.getElementById("card-title");
const cardBody = document.getElementById("card-body");
const closeBtn = document.getElementById("close");
let activeEl = null;

/* build the tulips */
function buildTulips(layout) {
  field.querySelectorAll(".tulip").forEach((el) => el.remove());
  layout.forEach((pos, i) => {
  const btn = document.createElement("button");
  btn.className = "tulip";
  btn.type = "button";
  btn.setAttribute("aria-label", MESSAGES[i] ? MESSAGES[i].title : "Tulip " + (i + 1));
  btn.style.left = pos.x + "%";
  btn.style.bottom = pos.y + "%";
  btn.style.setProperty("--size", pos.size);
  btn.style.setProperty("--scale", pos.scale);
  btn.style.setProperty("--delay", (-Math.random() * 5).toFixed(2) + "s");
  btn.style.marginLeft = "calc(var(--size) * var(--scale) / -2)";
  btn.style.zIndex = 100 - Math.round(pos.y);
  if (pos.star) {
    btn.classList.add("star");
    btn.style.zIndex = 200;
    btn.style.animationDuration = "7s";
  }

  const img = document.createElement("img");
  img.src = "tulip.png";
  img.alt = "";
  img.draggable = false;
  btn.appendChild(img);

  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (activeEl === btn) return closeCard();
    openCard(btn, MESSAGES[i]);
  });
  field.appendChild(btn);
  });
}

/* pick the layout for the screen size, and switch if it changes (e.g. rotating the phone) */
const phoneQuery = window.matchMedia("(max-width: 600px)");
function render() {
  closeCard();
  buildTulips(phoneQuery.matches ? LAYOUT_MOBILE : LAYOUT);
}
phoneQuery.addEventListener("change", render);

function openCard(btn, msg) {
  if (activeEl) activeEl.classList.remove("active");
  activeEl = btn;
  btn.classList.add("active");

  cardTitle.textContent = msg.title;
  cardBody.innerHTML = "";
  if (msg.text) {
    // one big block of text (line breaks in the text are kept)
    const p = document.createElement("p");
    p.className = "long";
    p.textContent = msg.text;
    cardBody.appendChild(p);
  } else {
    msg.lines.forEach((t) => {
      const p = document.createElement("p");
      p.textContent = t;
      cardBody.appendChild(p);
    });
  }

  card.classList.toggle("big", btn.classList.contains("star"));
  card.classList.add("open");
  placeCard(btn);
}

function placeCard(btn) {
  const r = btn.getBoundingClientRect();
  const cw = card.offsetWidth, ch = card.offsetHeight, gap = 12, pad = 12;
  let left = r.left + r.width / 2 - cw / 2;
  left = Math.max(pad, Math.min(left, window.innerWidth - cw - pad));
  let top = r.top - ch - gap;                       // above the flower
  if (top < pad) top = Math.min(r.bottom + gap, window.innerHeight - ch - pad); // else below
  card.style.left = left + "px";
  card.style.top = top + "px";
}

function closeCard() {
  card.classList.remove("open");
  if (activeEl) activeEl.classList.remove("active");
  activeEl = null;
}

closeBtn.addEventListener("click", closeCard);
document.addEventListener("click", (e) => { if (!card.contains(e.target)) closeCard(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeCard(); });
window.addEventListener("resize", () => { if (activeEl) placeCard(activeEl); });

render();
</script>
</body>
</html>
